name: test

# spec 028 T047: golden tests are only authoritative once verified in a
# clean, reproducible environment (test/golden/README.md — "CI is the
# source of truth for goldens; a local --update-goldens run is advisory
# until it lands there"). No CI existed before this workflow, so that line
# was aspirational; this makes it true.

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version test/golden/goldens/ was generated on — golden
      # comparisons are sensitive to the Flutter version, not just the host
      # OS/GPU/font stack the README already calls out.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Golden/screenshot mismatches write side-by-side master/test/diff
      # PNGs here (test/golden/README.md's "Failure feedback" pointer) —
      # otherwise a red run gives no way to see what actually differed.
      - name: Upload golden/screenshot failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: |
            test/golden/failures/
            test/screenshots/failures/
          if-no-files-found: ignore

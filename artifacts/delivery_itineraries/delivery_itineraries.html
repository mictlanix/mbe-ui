"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a061a4a7-0895-4f46-92b2-c263933314e6\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>@font-face{\n  font-family: 'Archivo';\n  src: url(\"b79ac805-a046-4ae4-879e-ac051cb7fad3\") format('truetype-variations');\n  font-weight: 400 700;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face{\n  font-family: 'RobotoMono';\n  src: url(\"06681b68-38bc-4482-9b62-2d8d9c786962\") format('truetype-variations');\n  font-weight: 400 500;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n<style>/*\n * MBE-UI design tokens (spec 022, mictlanix/mbe-ui). Tokens-only -- the\n * source app is Flutter/Dart, so there are no components to ship here,\n * only the values: colors, spacing, shape, elevation, and type. Values are\n * transcribed verbatim from lib/core/branding/{xbe_palette,brand_ink}.dart\n * and lib/core/design/{spacing,shapes,elevations,type_roles}.dart, plus\n * Flutter's own M3 englishLike2021 type-scale table (never restated by the\n * app itself -- see typography.dart in the Flutter SDK).\n *\n * Two brand-owner-unconfirmed values, carried over honestly from source:\n *  - --mbe-color-light-surface-container-low is interpolated (no approved\n *    value exists in the brand guide's light-mode section).\n *  - Archivo tracking corrections for display*/headlineLarge at w700 were\n *    never measured against brand mockups (DESIGN-SYSTEM.md open question);\n *    this file uses M3's own tracking values unmodified, same as the app.\n */\n\n/* ---------------------------------------------------------------------- */\n/* Fonts -- Archivo (display/headline/title/label) and RobotoMono (record\n   IDs, timestamps). Roboto (body text) is NOT bundled by the app itself --\n   it renders on Flutter's platform default and has no shipped font file to\n   carry here; body text below falls back to a system sans-serif stack. */\n/* ---------------------------------------------------------------------- */\n\n/* @ds-font-face-dropped: unresolvable src */\n\n/* @ds-font-face-dropped: unresolvable src */\n\n:root {\n  --mbe-font-brand: 'Archivo', system-ui, sans-serif;\n  --mbe-font-body: 'Roboto', system-ui, sans-serif; /* not bundled -- see note above */\n  --mbe-font-mono: 'RobotoMono', ui-monospace, monospace;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Color -- full ColorScheme, resolved for the default XBE brand via\n   ColorScheme.fromSeed(seedColor: 0xFFECAB03, variant: fidelity) with the\n   pinned-role overrides in xbe_palette.dart. A deployment overriding the\n   seed color gets none of these XBE-specific values (spec 019 FR-007) --\n   this file documents the DEFAULT brand only, not the brandable mechanism.\n   Toggle dark mode by setting data-mbe-theme=\"dark\" on an ancestor. */\n/* ---------------------------------------------------------------------- */\n\n:root,\n[data-mbe-theme='light'] {\n  --mbe-color-primary: #ecab03;\n  --mbe-color-on-primary: #241900;\n  --mbe-color-primary-container: #ffe7a8;\n  --mbe-color-on-primary-container: #5c4000;\n  --mbe-color-secondary: #5a5349;\n  --mbe-color-on-secondary: #ffffff;\n  --mbe-color-secondary-container: #fed794;\n  --mbe-color-on-secondary-container: #785c26;\n  --mbe-color-tertiary: #ec672a;\n  --mbe-color-on-tertiary: #ffffff;\n  --mbe-color-tertiary-container: #4ec1ff;\n  --mbe-color-on-tertiary-container: #004d6d;\n  --mbe-color-error: #c4262e;\n  --mbe-color-on-error: #ffffff;\n  --mbe-color-error-container: #fbdedf;\n  --mbe-color-on-error-container: #a31219;\n  --mbe-color-surface: #fbf8f3;\n  --mbe-color-on-surface: #1c1a16;\n  --mbe-color-on-surface-variant: #5a5349;\n  --mbe-color-surface-container-lowest: #ffffff;\n  --mbe-color-surface-container-low: #f9f6f1; /* interpolated -- see header note */\n  --mbe-color-surface-container: #f3ede3;\n  --mbe-color-surface-container-high: #f3e6d7;\n  --mbe-color-surface-container-highest: #ede1d1;\n  --mbe-color-outline: #c4bbac;\n  --mbe-color-outline-variant: #e3dacc;\n  --mbe-color-inverse-surface: #362f25;\n  --mbe-color-on-inverse-surface: #fcefdf;\n  --mbe-color-inverse-primary: #febb21;\n  --mbe-color-scrim: #000000;\n  --mbe-color-shadow: #000000;\n\n  /* BrandInk -- contrast-safe foreground for brand-colored text/icons on a\n     surface (never use --mbe-color-primary itself as a text color; raw\n     gold fails contrast on light surfaces -- see brand_ink.dart). */\n  --mbe-color-brand-ink: #7a5600;\n}\n\n[data-mbe-theme='dark'] {\n  --mbe-color-primary: #ecab03;\n  --mbe-color-on-primary: #241900;\n  --mbe-color-primary-container: #4b3703;\n  --mbe-color-on-primary-container: #ffd466;\n  --mbe-color-secondary: #c7c7c8;\n  --mbe-color-on-secondary: #232323;\n  --mbe-color-secondary-container: #5c420d;\n  --mbe-color-on-secondary-container: #d4b071;\n  --mbe-color-tertiary: #ec672a;\n  --mbe-color-on-tertiary: #2b0f00;\n  --mbe-color-tertiary-container: #4ec1ff;\n  --mbe-color-on-tertiary-container: #004d6d;\n  --mbe-color-error: #d8262e;\n  --mbe-color-on-error: #ffffff;\n  --mbe-color-error-container: #3a1416;\n  --mbe-color-on-error-container: #ff8f93;\n  --mbe-color-surface: #14120f;\n  --mbe-color-on-surface: #efe9df;\n  --mbe-color-on-surface-variant: #b4aca0;\n  --mbe-color-surface-container-lowest: #0f0d0b;\n  --mbe-color-surface-container-low: #1b1814;\n  --mbe-color-surface-container: #221e19;\n  --mbe-color-surface-container-high: #2f291f;\n  --mbe-color-surface-container-highest: #3b3429;\n  --mbe-color-outline: #4e473d;\n  --mbe-color-outline-variant: #332e27;\n  --mbe-color-inverse-surface: #ede1d1;\n  --mbe-color-on-inverse-surface: #362f25;\n  --mbe-color-inverse-primary: #7c5800;\n  --mbe-color-scrim: #000000;\n  --mbe-color-shadow: #000000;\n\n  --mbe-color-brand-ink: #ecab03;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-mbe-theme='light']) {\n    --mbe-color-primary: #ecab03;\n    --mbe-color-on-primary: #241900;\n    --mbe-color-primary-container: #4b3703;\n    --mbe-color-on-primary-container: #ffd466;\n    --mbe-color-secondary: #c7c7c8;\n    --mbe-color-on-secondary: #232323;\n    --mbe-color-secondary-container: #5c420d;\n    --mbe-color-on-secondary-container: #d4b071;\n    --mbe-color-tertiary: #ec672a;\n    --mbe-color-on-tertiary: #2b0f00;\n    --mbe-color-tertiary-container: #4ec1ff;\n    --mbe-color-on-tertiary-container: #004d6d;\n    --mbe-color-error: #d8262e;\n    --mbe-color-on-error: #ffffff;\n    --mbe-color-error-container: #3a1416;\n    --mbe-color-on-error-container: #ff8f93;\n    --mbe-color-surface: #14120f;\n    --mbe-color-on-surface: #efe9df;\n    --mbe-color-on-surface-variant: #b4aca0;\n    --mbe-color-surface-container-lowest: #0f0d0b;\n    --mbe-color-surface-container-low: #1b1814;\n    --mbe-color-surface-container: #221e19;\n    --mbe-color-surface-container-high: #2f291f;\n    --mbe-color-surface-container-highest: #3b3429;\n    --mbe-color-outline: #4e473d;\n    --mbe-color-outline-variant: #332e27;\n    --mbe-color-inverse-surface: #ede1d1;\n    --mbe-color-on-inverse-surface: #362f25;\n    --mbe-color-inverse-primary: #7c5800;\n    --mbe-color-brand-ink: #ecab03;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Elevation -- surface color carries depth (M3's preferred idiom); shadow\n   is reserved for transient overlays only (floating, modal). No level\n   mixes both. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  --mbe-elevation-flat: var(--mbe-color-surface);\n  --mbe-elevation-sunken: var(--mbe-color-surface-container-lowest);\n  --mbe-elevation-raised: var(--mbe-color-surface-container-low);\n  --mbe-elevation-engaged: var(--mbe-color-surface-container);\n  --mbe-elevation-floating: var(--mbe-color-surface-container-high);\n  --mbe-elevation-floating-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);\n  --mbe-elevation-modal: var(--mbe-color-surface-container-highest);\n  --mbe-elevation-modal-shadow: 0 5px 10px rgba(0, 0, 0, 0.35);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Shape -- corner radius scale (spacing.dart/shapes.dart). Tier-invariant. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  --mbe-radius-none: 0px; /* table cells, dividers, full-bleed surfaces */\n  --mbe-radius-xs: 4px; /* filled text field, snackbar */\n  --mbe-radius-sm: 8px; /* chips, badges, menu items */\n  --mbe-radius-md: 12px; /* inner containers */\n  --mbe-radius-lg: 16px; /* cards and panels -- brand guide's dominant radius */\n  --mbe-radius-xl: 28px; /* dialogs, side sheets, bottom sheets */\n  --mbe-radius-full: 9999px; /* buttons, nav indicators, filter pills (pill shape) */\n}\n\n/* ---------------------------------------------------------------------- */\n/* Spacing -- fixed 8-step scale (tier-invariant) plus per-tier layout\n   metrics. Breakpoints match LayoutBreakpoints exactly: compact <600,\n   medium 600-839, expanded 840-1199, large >=1200. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  --mbe-spacing-none: 0px;\n  --mbe-spacing-xxs: 4px;\n  --mbe-spacing-xs: 8px;\n  --mbe-spacing-sm: 12px;\n  --mbe-spacing-md: 16px;\n  --mbe-spacing-lg: 24px;\n  --mbe-spacing-xl: 32px;\n  --mbe-spacing-xxl: 48px;\n  --mbe-spacing-xxxl: 64px;\n\n  /* compact tier (<600px) -- default */\n  --mbe-layout-screen-margin: 16px;\n  --mbe-layout-pane-gutter: 0px;\n  --mbe-layout-card-padding: 16px;\n  --mbe-layout-field-gap-vertical: 16px;\n  --mbe-layout-field-gap-horizontal: 0px;\n  --mbe-layout-section-gap: 24px;\n  --mbe-layout-content-max-width: none;\n}\n\n@media (min-width: 600px) {\n  /* medium tier (600-839px) */\n  :root {\n    --mbe-layout-screen-margin: 24px;\n    --mbe-layout-pane-gutter: 24px;\n    --mbe-layout-card-padding: 16px;\n    --mbe-layout-field-gap-vertical: 16px;\n    --mbe-layout-field-gap-horizontal: 16px;\n    --mbe-layout-section-gap: 32px;\n  }\n}\n\n@media (min-width: 840px) {\n  /* expanded tier (840-1199px) */\n  :root {\n    --mbe-layout-card-padding: 24px;\n    --mbe-layout-field-gap-horizontal: 24px;\n  }\n}\n\n@media (min-width: 1200px) {\n  /* large tier (>=1200px) -- only content-max-width changes from expanded */\n  :root {\n    --mbe-layout-content-max-width: 1440px;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Density -- keyed on input modality (pointer vs touch), never on viewport\n   width: a wide touch tablet still gets touch metrics, a narrow desktop\n   window still gets pointer metrics. `pointer` is the CSS analogue of\n   Flutter's non-touch platforms; `coarse` is the analogue of touch. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  /* pointer (mouse/trackpad) -- default */\n  --mbe-density-min-target-size: 40px;\n  --mbe-density-table-heading-row-height: 48px;\n  --mbe-density-table-data-row-height: 44px;\n  --mbe-density-list-row-min-height: 48px;\n  --mbe-density-icon-button-size: 40px;\n}\n\n@media (pointer: coarse) {\n  /* touch */\n  :root {\n    --mbe-density-min-target-size: 48px;\n    --mbe-density-table-heading-row-height: none; /* tables become card lists on touch -- out of scope, spec 022 FR-025 */\n    --mbe-density-table-data-row-height: none;\n    --mbe-density-list-row-min-height: 56px;\n    --mbe-density-icon-button-size: 48px;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Type -- 21 semantic slots (type_roles.dart), each a family/size/weight/\n   tracking/line-height bundle. Base values are the compact-tier mapping;\n   medium/expanded breakpoints override only the slots that actually change\n   (data-model.md §5). Sizes/line-heights/tracking are Flutter's own M3\n   englishLike2021 table, restated here verbatim, never invented. Weights\n   on display/headline/title/label slots are the brand's Archivo\n   substitution (_brandTextTheme); body-role slots keep M3's own weight\n   because the brand override never touches body roles. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  /* screenTitle -- titleLarge, all tiers */\n  --mbe-type-screen-title-family: var(--mbe-font-brand);\n  --mbe-type-screen-title-weight: 600;\n  --mbe-type-screen-title-size: 22px;\n  --mbe-type-screen-title-tracking: 0px;\n  --mbe-type-screen-title-leading: 1.27;\n\n  /* heroHeading -- compact: headlineMedium */\n  --mbe-type-hero-heading-family: var(--mbe-font-brand);\n  --mbe-type-hero-heading-weight: 600;\n  --mbe-type-hero-heading-size: 28px;\n  --mbe-type-hero-heading-tracking: 0px;\n  --mbe-type-hero-heading-leading: 1.29;\n\n  /* heroSubhead -- bodyLarge, all tiers (never brand-overridden) */\n  --mbe-type-hero-subhead-family: var(--mbe-font-body);\n  --mbe-type-hero-subhead-weight: 400;\n  --mbe-type-hero-subhead-size: 16px;\n  --mbe-type-hero-subhead-tracking: 0.5px;\n  --mbe-type-hero-subhead-leading: 1.5;\n\n  /* pageHeading -- compact: emphasize(headlineSmall) => w700 override */\n  --mbe-type-page-heading-family: var(--mbe-font-brand);\n  --mbe-type-page-heading-weight: 700;\n  --mbe-type-page-heading-size: 24px;\n  --mbe-type-page-heading-tracking: 0px;\n  --mbe-type-page-heading-leading: 1.33;\n\n  /* sectionHeading -- compact/medium: titleMedium */\n  --mbe-type-section-heading-family: var(--mbe-font-brand);\n  --mbe-type-section-heading-weight: 600;\n  --mbe-type-section-heading-size: 16px;\n  --mbe-type-section-heading-tracking: 0.15px;\n  --mbe-type-section-heading-leading: 1.5;\n\n  /* cardTitle -- titleMedium, all tiers */\n  --mbe-type-card-title-family: var(--mbe-font-brand);\n  --mbe-type-card-title-weight: 600;\n  --mbe-type-card-title- l, all tiers */\n  --mbe-type-field-label-family: var(--mbe-font-body);\n  --mbe-type-field-label-weight: 400;\n  --mbe-type-field-label-size: 12px;\n  --mbe-type-field-label-tracking: 0.4px;\n  --mbe-type-field-label-leading: 1.33;\n\n  /* chipLabel -- compact/medium: labelLarge */\n  --mbe-type-chip-label-family: var(--mbe-font-brand);\n  --mbe-type-chip-label-weight: 600;\n  --mbe-type-chip-label-size: 14px;\n  --mbe-type-chip-label-tracking: 0.1px;\n  --mbe-type-chip-label-leading: 1.43;\n\n  /* buttonLabel -- labelLarge, all tiers */\n  --mbe-type-button-label-family: var(--mbe-font-brand);\n  --mbe-type-button-label-weight: 600;\n  --mbe-type-button-label-size: 14px;\n  --mbe-type-button-label-tracking: 0.1px;\n  --mbe-type-button-label-leading: 1.43;\n\n  /* money -- bodyMedium + tabular figures, all tiers */\n  --mbe-type-money-family: var(--mbe-font-body);\n  --mbe-type-money-weight: 400;\n  --mbe-type-money-size: 14px;\n  --mbe-type-money-tracking: 0.25px;\n  --mbe-type-money-leading: 1.43;\n  --mbe-type-money-variant: tabular-nums;\n\n  /* recordId -- bodyMedium metrics, RobotoMono family (FR-028) */\n  --mbe-type-record-id-family: var(--mbe-font-mono);\n  --mbe-type-record-id-weight: 400;\n  --mbe-type-record-id-size: 14px;\n  --mbe-type-record-id-tracking: 0.25px;\n  --mbe-type-record-id-leading: 1.43;\n\n  /* timestamp -- bodySmall metrics, RobotoMono family */\n  --mbe-type-timestamp-family: var(--mbe-font-mono);\n  --mbe-type-timestamp-weight: 400;\n  --mbe-type-timestamp-size: 12px;\n  --mbe-type-timestamp-tracking: 0.4px;\n  --mbe-type-timestamp-leading: 1.33;\n\n  /* productCode -- bodyMedium, deliberately NOT mono (FR-028) */\n  --mbe-type-product-code-family: var(--mbe-font-body);\n  --mbe-type-product-code-weight: 400;\n  --mbe-type-product-code-size: 14px;\n  --mbe-type-product-code-tracking: 0.25px;\n  --mbe-type-product-code-leading: 1.43;\n\n  /* overlayText -- compact/medium: bodyMedium */\n  --mbe-type-overlay-text-family: var(--mbe-font-body);\n  --mbe-type-overlay-text-weight: 400;\n  --mbe-type-overlay-text-size: 14px;\n  --mbe-type-overlay-text-tracking: 0.25px;\n  --mbe-type-overlay-text-leading: 1.43;\n}\n\n@media (min-width: 600px) {\n  /* medium tier: heroHeading and pageHeading/metricValue's base role step up\n     to display/headline-medium; sectionHeading/chipLabel/overlayText/\n     fieldInput do NOT change yet -- they wait for the 840px boundary. */\n  :root {\n    --mbe-type-hero-heading-size: 36px;\n    --mbe-type-hero-heading-weight: 700;\n    --mbe-type-hero-heading-tracking: 0px;\n    --mbe-type-hero-heading-leading: 1.22;\n\n    --mbe-type-page-heading-size: 28px;\n    --mbe-type-page-heading-leading: 1.29;\n\n    --mbe-type-metric-value-size: 28px;\n    --mbe-type-metric-value-leading: 1.29;\n  }\n}\n\n@media (min-width: 840px) {\n  /* expanded tier (and large, which matches expanded for every type role) */\n  :root {\n    --mbe-type-section-heading-size: 22px;\n    --mbe-type-section-heading-tracking: 0px;\n    --mbe-type-section-heading-leading: 1.27;\n\n    --mbe-type-field-input-family: var(--mbe-font-body);\n    --mbe-type-field-input-size: 14px;\n    --mbe-type-field-input-tracking: 0.25px;\n    --mbe-type-field-input-leading: 1.43;\n\n    --mbe-type-chip-label-weight: 600;\n    --mbe-type-chip-label-size: 12px;\n    --mbe-type-chip-label-tracking: 0.5px;\n    --mbe-type-chip-label-leading: 1.33;\n\n    --mbe-type-overlay-text-size: 12px;\n    --mbe-type-overlay-text-tracking: 0.4px;\n    --mbe-type-overlay-text-leading: 1.33;\n  }\n}\n<\u002Fstyle>\n<style>@font-face{\n  font-family: 'Archivo';\n  src: url(\"b79ac805-a046-4ae4-879e-ac051cb7fad3\") format('truetype-variations');\n  font-weight: 400 700;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face{\n  font-family: 'RobotoMono';\n  src: url(\"06681b68-38bc-4482-9b62-2d8d9c786962\") format('truetype-variations');\n  font-weight: 400 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n/*\n * MBE-UI design tokens (spec 022, mictlanix/mbe-ui). Tokens-only -- the\n * source app is Flutter/Dart, so there are no components to ship here,\n * only the values: colors, spacing, shape, elevation, and type. Values are\n * transcribed verbatim from lib/core/branding/{xbe_palette,brand_ink}.dart\n * and lib/core/design/{spacing,shapes,elevations,type_roles}.dart, plus\n * Flutter's own M3 englishLike2021 type-scale table (never restated by the\n * app itself -- see typography.dart in the Flutter SDK).\n *\n * Two brand-owner-unconfirmed values, carried over honestly from source:\n *  - --mbe-color-light-surface-container-low is interpolated (no approved\n *    value exists in the brand guide's light-mode section).\n *  - Archivo tracking corrections for display*/headlineLarge at w700 were\n *    never measured against brand mockups (DESIGN-SYSTEM.md open question);\n *    this file uses M3's own tracking values unmodified, same as the app.\n */\n\n/* ---------------------------------------------------------------------- */\n/* Fonts -- Archivo (display/headline/title/label) and RobotoMono (record\n   IDs, timestamps). Roboto (body text) is NOT bundled by the app itself --\n   it renders on Flutter's platform default and has no shipped font file to\n   carry here; body text below falls back to a system sans-serif stack. */\n/* ---------------------------------------------------------------------- */\n\n/* @ds-font-face-dropped: unresolvable src */\n\n/* @ds-font-face-dropped: unresolvable src */\n\n:root {\n  --mbe-font-brand: 'Archivo', system-ui, sans-serif;\n  --mbe-font-body: 'Roboto', system-ui, sans-serif; /* not bundled -- see note above */\n  --mbe-font-mono: 'RobotoMono', ui-monospace, monospace;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Color -- full ColorScheme, resolved for the default XBE brand via\n   ColorScheme.fromSeed(seedColor: 0xFFECAB03, variant: fidelity) with the\n   pinned-role overrides in xbe_palette.dart. A deployment overriding the\n   seed color gets none of these XBE-specific values (spec 019 FR-007) --\n   this file documents the DEFAULT brand only, not the brandable mechanism.\n   Toggle dark mode by setting data-mbe-theme=\"dark\" on an ancestor. */\n/* ---------------------------------------------------------------------- */\n\n:root,\n[data-mbe-theme='light'] {\n  --mbe-color-primary: #ecab03;\n  --mbe-color-on-primary: #241900;\n  --mbe-color-primary-container: #ffe7a8;\n  --mbe-color-on-primary-container: #5c4000;\n  --mbe-color-secondary: #5a5349;\n  --mbe-color-on-secondary: #ffffff;\n  --mbe-color-secondary-container: #fed794;\n  --mbe-color-on-secondary-container: #785c26;\n  --mbe-color-tertiary: #ec672a;\n  --mbe-color-on-tertiary: #ffffff;\n  --mbe-color-tertiary-container: #4ec1ff;\n  --mbe-color-on-tertiary-container: #004d6d;\n  --mbe-color-error: #c4262e;\n  --mbe-color-on-error: #ffffff;\n  --mbe-color-error-container: #fbdedf;\n  --mbe-color-on-error-container: #a31219;\n  --mbe-color-surface: #fbf8f3;\n  --mbe-color-on-surface: #1c1a16;\n  --mbe-color-on-surface-variant: #5a5349;\n  --mbe-color-surface-container-lowest: #ffffff;\n  --mbe-color-surface-container-low: #f9f6f1; /* interpolated -- see header note */\n  --mbe-color-surface-container: #f3ede3;\n  --mbe-color-surface-container-high: #f3e6d7;\n  --mbe-color-surface-container-highest: #ede1d1;\n  --mbe-color-outline: #c4bbac;\n  --mbe-color-outline-variant: #e3dacc;\n  --mbe-color-inverse-surface: #362f25;\n  --mbe-color-on-inverse-surface: #fcefdf;\n  --mbe-color-inverse-primary: #febb21;\n  --mbe-color-scrim: #000000;\n  --mbe-color-shadow: #000000;\n\n  /* BrandInk -- contrast-safe foreground for brand-colored text/icons on a\n     surface (never use --mbe-color-primary itself as a text color; raw\n     gold fails contrast on light surfaces -- see brand_ink.dart). */\n  --mbe-color-brand-ink: #7a5600;\n}\n\n[data-mbe-theme='dark'] {\n  --mbe-color-primary: #ecab03;\n  --mbe-color-on-primary: #241900;\n  --mbe-color-primary-container: #4b3703;\n  --mbe-color-on-primary-container: #ffd466;\n  --mbe-color-secondary: #c7c7c8;\n  --mbe-color-on-secondary: #232323;\n  --mbe-color-secondary-container: #5c420d;\n  --mbe-color-on-secondary-container: #d4b071;\n  --mbe-color-tertiary: #ec672a;\n  --mbe-color-on-tertiary: #2b0f00;\n  --mbe-color-tertiary-container: #4ec1ff;\n  --mbe-color-on-tertiary-container: #004d6d;\n  --mbe-color-error: #d8262e;\n  --mbe-color-on-error: #ffffff;\n  --mbe-color-error-container: #3a1416;\n  --mbe-color-on-error-container: #ff8f93;\n  --mbe-color-surface: #14120f;\n  --mbe-color-on-surface: #efe9df;\n  --mbe-color-on-surface-variant: #b4aca0;\n  --mbe-color-surface-container-lowest: #0f0d0b;\n  --mbe-color-surface-container-low: #1b1814;\n  --mbe-color-surface-container: #221e19;\n  --mbe-color-surface-container-high: #2f291f;\n  --mbe-color-surface-container-highest: #3b3429;\n  --mbe-color-outline: #4e473d;\n  --mbe-color-outline-variant: #332e27;\n  --mbe-color-inverse-surface: #ede1d1;\n  --mbe-color-on-inverse-surface: #362f25;\n  --mbe-color-inverse-primary: #7c5800;\n  --mbe-color-scrim: #000000;\n  --mbe-color-shadow: #000000;\n\n  --mbe-color-brand-ink: #ecab03;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-mbe-theme='light']) {\n    --mbe-color-primary: #ecab03;\n    --mbe-color-on-primary: #241900;\n    --mbe-color-primary-container: #4b3703;\n    --mbe-color-on-primary-container: #ffd466;\n    --mbe-color-secondary: #c7c7c8;\n    --mbe-color-on-secondary: #232323;\n    --mbe-color-secondary-container: #5c420d;\n    --mbe-color-on-secondary-container: #d4b071;\n    --mbe-color-tertiary: #ec672a;\n    --mbe-color-on-tertiary: #2b0f00;\n    --mbe-color-tertiary-container: #4ec1ff;\n    --mbe-color-on-tertiary-container: #004d6d;\n    --mbe-color-error: #d8262e;\n    --mbe-color-on-error: #ffffff;\n    --mbe-color-error-container: #3a1416;\n    --mbe-color-on-error-container: #ff8f93;\n    --mbe-color-surface: #14120f;\n    --mbe-color-on-surface: #efe9df;\n    --mbe-color-on-surface-variant: #b4aca0;\n    --mbe-color-surface-container-lowest: #0f0d0b;\n    --mbe-color-surface-container-low: #1b1814;\n    --mbe-color-surface-container: #221e19;\n    --mbe-color-surface-container-high: #2f291f;\n    --mbe-color-surface-container-highest: #3b3429;\n    --mbe-color-outline: #4e473d;\n    --mbe-color-outline-variant: #332e27;\n    --mbe-color-inverse-surface: #ede1d1;\n    --mbe-color-on-inverse-surface: #362f25;\n    --mbe-color-inverse-primary: #7c5800;\n    --mbe-color-brand-ink: #ecab03;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Elevation -- surface color carries depth (M3's preferred idiom); shadow\n   is reserved for transient overlays only (floating, modal). No level\n   mixes both. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  --mbe-elevation-flat: var(--mbe-color-surface);\n  --mbe-elevation-sunken: var(--mbe-color-surface-container-lowest);\n  --mbe-elevation-raised: var(--mbe-color-surface-container-low);\n  --mbe-elevation-engaged: var(--mbe-color-surface-container);\n  --mbe-elevation-floating: var(--mbe-color-surface-container-high);\n  --mbe-elevation-floating-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);\n  --mbe-elevation-modal: var(--mbe-color-surface-container-highest);\n  --mbe-elevation-modal-shadow: 0 5px 10px rgba(0, 0, 0, 0.35);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Shape -- corner radius scale (spacing.dart/shapes.dart). Tier-invariant. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  --mbe-radius-none: 0px; /* table cells, dividers, full-bleed surfaces */\n  --mbe-radius-xs: 4px; /* filled text field, snackbar */\n  --mbe-radius-sm: 8px; /* chips, badges, menu items */\n  --mbe-radius-md: 12px; /* inner containers */\n  --mbe-radius-lg: 16px; /* cards and panels -- brand guide's dominant radius */\n  --mbe-radius-xl: 28px; /* dialogs, side sheets, bottom sheets */\n  --mbe-radius-full: 9999px; /* buttons, nav indicators, filter pills (pill shape) */\n}\n\n/* ---------------------------------------------------------------------- */\n/* Spacing -- fixed 8-step scale (tier-invariant) plus per-tier layout\n   metrics. Breakpoints match LayoutBreakpoints exactly: compact <600,\n   medium 600-839, expanded 840-1199, large >=1200. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  --mbe-spacing-none: 0px;\n  --mbe-spacing-xxs: 4px;\n  --mbe-spacing-xs: 8px;\n  --mbe-spacing-sm: 12px;\n  --mbe-spacing-md: 16px;\n  --mbe-spacing-lg: 24px;\n  --mbe-spacing-xl: 32px;\n  --mbe-spacing-xxl: 48px;\n  --mbe-spacing-xxxl: 64px;\n\n  /* compact tier (<600px) -- default */\n  --mbe-layout-screen-margin: 16px;\n  --mbe-layout-pane-gutter: 0px;\n  --mbe-layout-card-padding: 16px;\n  --mbe-layout-field-gap-vertical: 16px;\n  --mbe-layout-field-gap-horizontal: 0px;\n  --mbe-layout-section-gap: 24px;\n  --mbe-layout-content-max-width: none;\n}\n\n@media (min-width: 600px) {\n  /* medium tier (600-839px) */\n  :root {\n    --mbe-layout-screen-margin: 24px;\n    --mbe-layout-pane-gutter: 24px;\n    --mbe-layout-card-padding: 16px;\n    --mbe-layout-field-gap-vertical: 16px;\n    --mbe-layout-field-gap-horizontal: 16px;\n    --mbe-layout-section-gap: 32px;\n  }\n}\n\n@media (min-width: 840px) {\n  /* expanded tier (840-1199px) */\n  :root {\n    --mbe-layout-card-padding: 24px;\n    --mbe-layout-field-gap-horizontal: 24px;\n  }\n}\n\n@media (min-width: 1200px) {\n  /* large tier (>=1200px) -- only content-max-width changes from expanded */\n  :root {\n    --mbe-layout-content-max-width: 1440px;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Density -- keyed on input modality (pointer vs touch), never on viewport\n   width: a wide touch tablet still gets touch metrics, a narrow desktop\n   window still gets pointer metrics. `pointer` is the CSS analogue of\n   Flutter's non-touch platforms; `coarse` is the analogue of touch. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  /* pointer (mouse/trackpad) -- default */\n  --mbe-density-min-target-size: 40px;\n  --mbe-density-table-heading-row-height: 48px;\n  --mbe-density-table-data-row-height: 44px;\n  --mbe-density-list-row-min-height: 48px;\n  --mbe-density-icon-button-size: 40px;\n}\n\n@media (pointer: coarse) {\n  /* touch */\n  :root {\n    --mbe-density-min-target-size: 48px;\n    --mbe-density-table-heading-row-height: none; /* tables become card lists on touch -- out of scope, spec 022 FR-025 */\n    --mbe-density-table-data-row-height: none;\n    --mbe-density-list-row-min-height: 56px;\n    --mbe-density-icon-button-size: 48px;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Type -- 21 semantic slots (type_roles.dart), each a family/size/weight/\n   tracking/line-height bundle. Base values are the compact-tier mapping;\n   medium/expanded breakpoints override only the slots that actually change\n   (data-model.md §5). Sizes/line-heights/tracking are Flutter's own M3\n   englishLike2021 table, restated here verbatim, never invented. Weights\n   on display/headline/title/label slots are the brand's Archivo\n   substitution (_brandTextTheme); body-role slots keep M3's own weight\n   because the brand override never touches body roles. */\n/* ---------------------------------------------------------------------- */\n\n:root {\n  /* screenTitle -- titleLarge, all tiers */\n  --mbe-type-screen-title-family: var(--mbe-font-brand);\n  --mbe-type-screen-title-weight: 600;\n  --mbe-type-screen-title-size: 22px;\n  --mbe-type-screen-title-tracking: 0px;\n  --mbe-type-screen-title-leading: 1.27;\n\n  /* heroHeading -- compact: headlineMedium */\n  --mbe-type-hero-heading-family: var(--mbe-font-brand);\n  --mbe-type-hero-heading-weight: 600;\n  --mbe-type-hero-heading-size: 28px;\n  --mbe-type-hero-heading-tracking: 0px;\n  --mbe-type-hero-heading-leading: 1.29;\n\n  /* heroSubhead -- bodyLarge, all tiers (never brand-overridden) */\n  --mbe-type-hero-subhead-family: var(--mbe-font-body);\n  --mbe-type-hero-subhead-weight: 400;\n  --mbe-type-hero-subhead-size: 16px;\n  --mbe-type-hero-subhead-tracking: 0.5px;\n  --mbe-type-hero-subhead-leading: 1.5;\n\n  /* pageHeading -- compact: emphasize(headlineSmall) => w700 override */\n  --mbe-type-page-heading-family: var(--mbe-font-brand);\n  --mbe-type-page-heading-weight: 700;\n  --mbe-type-page-heading-size: 24px;\n  --mbe-type-page-heading-tracking: 0px;\n  --mbe-type-page-heading-leading: 1.33;\n\n  /* sectionHeading -- compact/medium: titleMedium */\n  --mbe-type-section-heading-family: var(--mbe-font-brand);\n  --mbe-type-section-heading-weight: 600;\n  --mbe-type-section-heading-size: 16px;\n  --mbe-type-section-heading-tracking: 0.15px;\n  --mbe-type-section-heading-leading: 1.5;\n\n  /* cardTitle -- titleMedium, all tiers */\n  --mbe-type-card-title-family: var(--mbe-font-brand);\n  --mbe-type-card-title-weight: 600;\n  --mbe-type-card-title-size: 16px;\n  --mbe-type-card-title-tracking: 0.15px;\n  --mbe-type-card-title-leading: 1.5;\n\n  /* metricValue -- compact: emphasize(headlineSmall) => w700 override */\n  --mbe-type-metric-value-family: var(--mbe-font-brand);\n  --mbe-type-metric-value-weight: 700;\n  --mbe-type-metric-value-size: 24px;\n  --mbe-type-metric-value-tracking: 0px;\n  --mbe-type-metric-value-leading: 1.33;\n\n  /* metricLabel -- bodySmall, all tiers */\n  --mbe-type-metric-label-family: var(--mbe-font-body);\n  --mbe-type-metric-label-weight: 400;\n  --mbe-type-metric-label-size: 12px;\n  --mbe-type-metric-label-tracking: 0.4px;\n  --mbe-type-metric-label-leading: 1.33;\n\n  /* navLabel -- labelLarge, all tiers */\n  --mbe-type-nav-label-family: var(--mbe-font-brand);\n  --mbe-type-nav-label-weight: 600;\n  --mbe-type-nav-label-size: 14px;\n  --mbe-type-nav-label-tracking: 0.1px;\n  --mbe-type-nav-label-leading: 1.43;\n\n  /* navHeader -- titleSmall, all tiers */\n  --mbe-type-nav-header-family: var(--mbe-font-brand);\n  --mbe-type-nav-header-weight: 600;\n  --mbe-type-nav-header-size: 14px;\n  --mbe-type-nav-header-tracking: 0.1px;\n  --mbe-type-nav-header-leading: 1.43;\n\n  /* tableHeader -- labelLarge, all tiers */\n  --mbe-type-table-header-family: var(--mbe-font-brand);\n  --mbe-type-table-header-weight: 600;\n  --mbe-type-table-header-size: 14px;\n  --mbe-type-table-header-tracking: 0.1px;\n  --mbe-type-table-header-leading: 1.43;\n\n  /* tableCell -- bodyMedium, all tiers */\n  --mbe-type-table-cell-family: var(--mbe-font-body);\n  --mbe-type-table-cell-weight: 400;\n  --mbe-type-table-cell-size: 14px;\n  --mbe-type-table-cell-tracking: 0.25px;\n  --mbe-type-table-cell-leading: 1.43;\n\n  /* fieldInput -- compact/medium: bodyLarge */\n  --mbe-type-field-input-family: var(--mbe-font-body);\n  --mbe-type-field-input-weight: 400;\n  --mbe-type-field-input-size: 16px;\n  --mbe-type-field-input-tracking: 0.5px;\n  --mbe-type-field-input-leading: 1.5;\n\n  /* fieldLabel -- bodySmall, all tiers */\n  --mbe-type-field-label-family: var(--mbe-font-body);\n  --mbe-type-field-label-weight: 400;\n  --mbe-type-field-label-size: 12px;\n  --mbe-type-field-label-tracking: 0.4px;\n  --mbe-type-field-label-leading: 1.33;\n\n  /* chipLabel -- compact/medium: labelLarge */\n  --mbe-type-chip-label-family: var(--mbe-font-brand);\n  --mbe-type-chip-label-weight: 600;\n  --mbe-type-chip-label-size: 14px;\n  --mbe-type-chip-label-tracking: 0.1px;\n  --mbe-type-chip-label-leading: 1.43;\n\n  /* buttonLabel -- labelLarge, all tiers */\n  --mbe-type-button-label-family: var(--mbe-font-brand);\n  --mbe-type-button-label-weight: 600;\n  --mbe-type-button-label-size: 14px;\n  --mbe-type-button-label-tracking: 0.1px;\n  --mbe-type-button-label-leading: 1.43;\n\n  /* money -- bodyMedium + tabular figures, all tiers */\n  --mbe-type-money-family: var(--mbe-font-body);\n  --mbe-type-money-weight: 400;\n  --mbe-type-money-size: 14px;\n  --mbe-type-money-tracking: 0.25px;\n  --mbe-type-money-leading: 1.43;\n  --mbe-type-money-variant: tabular-nums;\n\n  /* recordId -- bodyMedium metrics, RobotoMono family (FR-028) */\n  --mbe-type-record-id-family: var(--mbe-font-mono);\n  --mbe-type-record-id-weight: 400;\n  --mbe-type-record-id-size: 14px;\n  --mbe-type-record-id-tracking: 0.25px;\n  --mbe-type-record-id-leading: 1.43;\n\n  /* timestamp -- bodySmall metrics, RobotoMono family */\n  --mbe-type-timestamp-family: var(--mbe-font-mono);\n  --mbe-type-timestamp-weight: 400;\n  --mbe-type-timestamp-size: 12px;\n  --mbe-type-timestamp-tracking: 0.4px;\n  --mbe-type-timestamp-leading: 1.33;\n\n  /* productCode -- bodyMedium, deliberately NOT mono (FR-028) */\n  --mbe-type-product-code-family: var(--mbe-font-body);\n  --mbe-type-product-code-weight: 400;\n  --mbe-type-product-code-size: 14px;\n  --mbe-type-product-code-tracking: 0.25px;\n  --mbe-type-product-code-leading: 1.43;\n\n  /* overlayText -- compact/medium: bodyMedium */\n  --mbe-type-overlay-text-family: var(--mbe-font-body);\n  --mbe-type-overlay-text-weight: 400;\n  --mbe-type-overlay-text-size: 14px;\n  --mbe-type-overlay-text-tracking: 0.25px;\n  --mbe-type-overlay-text-leading: 1.43;\n}\n\n@media (min-width: 600px) {\n  /* medium tier: heroHeading and pageHeading/metricValue's base role step up\n     to display/headline-medium; sectionHeading/chipLabel/overlayText/\n     fieldInput do NOT change yet -- they wait for the 840px boundary. */\n  :root {\n    --mbe-type-hero-heading-size: 36px;\n    --mbe-type-hero-heading-weight: 700;\n    --mbe-type-hero-heading-tracking: 0px;\n    --mbe-type-hero-heading-leading: 1.22;\n\n    --mbe-type-page-heading-size: 28px;\n    --mbe-type-page-heading-leading: 1.29;\n\n    --mbe-type-metric-value-size: 28px;\n    --mbe-type-metric-value-leading: 1.29;\n  }\n}\n\n@media (min-width: 840px) {\n  /* expanded tier (and large, which matches expanded for every type role) */\n  :root {\n    --mbe-type-section-heading-size: 22px;\n    --mbe-type-section-heading-tracking: 0px;\n    --mbe-type-section-heading-leading: 1.27;\n\n    --mbe-type-field-input-family: var(--mbe-font-body);\n    --mbe-type-field-input-size: 14px;\n    --mbe-type-field-input-tracking: 0.25px;\n    --mbe-type-field-input-leading: 1.43;\n\n    --mbe-type-chip-label-weight: 600;\n    --mbe-type-chip-label-size: 12px;\n    --mbe-type-chip-label-tracking: 0.5px;\n    --mbe-type-chip-label-leading: 1.33;\n\n    --mbe-type-overlay-text-size: 12px;\n    --mbe-type-overlay-text-tracking: 0.4px;\n    --mbe-type-overlay-text-leading: 1.33;\n  }\n}\n\n<\u002Fstyle>\n<style>\n:root{--mbe-font-brand:'Archivo',system-ui,sans-serif;--mbe-font-body:'Roboto',system-ui,sans-serif;--mbe-font-mono:'RobotoMono',ui-monospace,monospace}\nbody{margin:0;background:#e8e4dc}\n.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(0,0,0,.08)}\n.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}\n.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}\n.dv-tname{font:600 13px/1.2 system-ui,sans-serif;color:#1a1a1a}\n.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}\n.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}\n.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}\n.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.6);max-width:390px}\n.dv-opt:target .dv-oid{background:#2a78d6;color:#fff}\n.dv-next{margin:22px 0 0;font:12px/1.5 system-ui,sans-serif;color:rgba(0,0,0,.55)}\n.brief{max-width:760px;background:#fbf8f3;border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:24px 26px;margin:0 0 28px;font:13px/1.6 system-ui,sans-serif;color:#1c1a16}\n.brief h3{margin:0 0 10px;font:700 15px/1.2 Archivo,system-ui,sans-serif}\n.brief ul{margin:6px 0 0;padding-left:18px}\n.ph{width:390px;height:844px;border-radius:30px;overflow:hidden;position:relative;background:var(--mbe-color-surface);box-shadow:0 6px 20px rgba(0,0,0,.16);font-family:var(--mbe-font-body);color:var(--mbe-color-on-surface);display:flex;flex-direction:column}\n.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}\n.scroll::-webkit-scrollbar{width:0}\na{color:var(--mbe-color-brand-ink)}\na:hover{color:var(--mbe-color-on-primary-container)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section class=\"dv-turn\" id=\"t2\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t2\">2<\u002Fa><span class=\"dv-tname\">Sync states the outbox model implies — resumable POD upload, server acknowledgement, queue settings<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"2a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>Sending a closed stop — outcomes go first, the photo resumes on its own. Live: tap the button.<\u002Fdiv>\n<div class=\"ph\" data-screen-label=\"Upload progress\">\n  <div style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--mbe-color-surface-container)\">\n    <span style=\"font-size:22px\">‹<\u002Fspan>\n    <div style=\"flex:1\">\n      <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:22px\">Sending stop 6<\u002Fdiv>\n      <div style=\"font-family:var(--mbe-font-mono);font-size:12px;color:var(--mbe-color-on-surface-variant)\">closed 09:48 · Materiales Herrera<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"scroll\" style=\"padding:16px\">\n    <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant);margin-bottom:12px\">The delivery is already recorded on this phone. This screen only shows how much of it has reached the server.<\u002Fdiv>\n    <sc-for list=\"{{ uploads }}\" as=\"u\" hint-placeholder-count=\"3\">\n      <div style=\"border-radius:16px;padding:14px;margin-bottom:10px;background:var(--mbe-color-surface-container-low);border:1px solid var(--mbe-color-outline-variant)\">\n        <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:flex-start\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:16px\">{{ u.name }}<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant)\">{{ u.detail }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"{{ u.chipStyle }}\">{{ u.chip }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ u.showBar }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:12px\">\n            <div style=\"height:10px;border-radius:9999px;background:var(--mbe-color-surface-container-high);overflow:hidden\"><span style=\"{{ u.barStyle }}\"><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mbe-font-mono);font-size:12px;color:var(--mbe-color-on-surface-variant)\"><span>{{ u.sent }}<\u002Fspan><span>{{ u.attempts }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--mbe-color-surface-container);font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant)\">Uploads resume from where they stopped, even after the app is killed. Nothing here is ever re-entered by hand.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:12px 16px 18px;background:var(--mbe-color-surface-container-high);border-top:1px solid var(--mbe-color-outline-variant)\">\n    <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant);margin-bottom:8px\">{{ uploadCaption }}<\u002Fdiv>\n    <button style=\"{{ uploadCtaStyle }}\" sc-camel-on-click=\"{{ startUpload }}\">{{ uploadCta }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"2b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2b\">2b<\u002Fa>Server acknowledgement — the driver sees dispatch has it, and what it changed.<\u002Fdiv>\n<div class=\"ph\" data-screen-label=\"Acknowledged\">\n  <div style=\"padding:22px 16px 18px;background:var(--mbe-color-inverse-surface);color:var(--mbe-color-on-inverse-surface)\">\n    <div style=\"width:52px;height:52px;border-radius:9999px;background:var(--mbe-color-primary);color:var(--mbe-color-on-primary);display:grid;place-items:center;font-size:24px;margin-bottom:14px\">✓<\u002Fdiv>\n    <div style=\"font-family:var(--mbe-font-brand);font-weight:700;font-size:24px;line-height:1.33\">Stop 6 is on the server<\u002Fdiv>\n    <div style=\"font-size:14px;letter-spacing:.25px;margin-top:4px;opacity:.85\">Accepted 10:12 · nothing left queued for this stop<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"scroll\" style=\"padding:16px\">\n    <div style=\"display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--mbe-color-surface-container-low);margin-bottom:16px\">\n      <div style=\"width:44px;height:44px;border-radius:9999px;background:var(--mbe-color-secondary-container);color:var(--mbe-color-on-secondary-container);display:grid;place-items:center;font-family:var(--mbe-font-brand);font-weight:600\">MP<\u002Fdiv>\n      <div style=\"flex:1\">\n        <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:16px\">Seen by dispatch<\u002Fdiv>\n        <div style=\"font-family:var(--mbe-font-mono);font-size:12px;color:var(--mbe-color-on-surface-variant)\">M. Padilla · 10:12<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:16px;margin-bottom:10px\">What it changed<\u002Fdiv>\n    <sc-for list=\"{{ ackItems }}\" as=\"a\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--mbe-color-outline-variant)\">\n        <span style=\"{{ a.dotStyle }}\"><\u002Fspan>\n        <div style=\"flex:1\">\n          <div style=\"font-size:16px;letter-spacing:.5px\">{{ a.text }}<\u002Fdiv>\n          <div style=\"font-family:var(--mbe-font-mono);font-size:12px;color:var(--mbe-color-on-surface-variant);margin-top:2px\">{{ a.ref }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant);padding:14px 0 4px\">Commitments stay reserved until the whole route closes — the truck still holds the returns.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:12px 16px 18px;background:var(--mbe-color-surface-container-high);border-top:1px solid var(--mbe-color-outline-variant)\">\n    <button style=\"width:100%;height:64px;border:0;border-radius:9999px;background:var(--mbe-color-primary);color:var(--mbe-color-on-primary);font-family:var(--mbe-font-brand);font-weight:600;font-size:18px\">Next stop<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"2c\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2c\">2c<\u002Fa>Queue settings — the two switches that decide when data leaves the phone. Live.<\u002Fdiv>\n<div class=\"ph\" data-screen-label=\"Sync settings\">\n  <div style=\"padding:14px 16px;background:var(--mbe-color-surface-container)\">\n    <div style=\"font-family:var(--mbe-font-brand);font-weight:700;font-size:24px\">Sync settings<\u002Fdiv>\n    <div style=\"font-size:14px;color:var(--mbe-color-on-surface-variant)\">Driver JR · van MBE-114<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"scroll\" style=\"padding:16px\">\n    <sc-for list=\"{{ settings }}\" as=\"g\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--mbe-color-surface-container-low);margin-bottom:12px\" sc-camel-on-click=\"{{ g.toggle }}\">\n        <div style=\"flex:1\">\n          <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:16px\">{{ g.title }}<\u002Fdiv>\n          <div style=\"font-size:14px;letter-spacing:.25px;color:var(--mbe-color-on-surface-variant);margin-top:2px\">{{ g.detail }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ g.trackStyle }}\"><span style=\"{{ g.knobStyle }}\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"padding:16px;border-radius:16px;background:var(--mbe-color-surface-container-low);margin-bottom:12px\">\n      <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:16px;margin-bottom:10px\">On this phone<\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-size:14px;letter-spacing:.25px;padding:6px 0\"><span style=\"color:var(--mbe-color-on-surface-variant)\">Queued actions<\u002Fspan><span style=\"font-family:var(--mbe-font-mono)\">{{ queueCount }}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-size:14px;letter-spacing:.25px;padding:6px 0\"><span style=\"color:var(--mbe-color-on-surface-variant)\">Proof images held<\u002Fspan><span style=\"font-family:var(--mbe-font-mono)\">4 · 5.1 MB<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-size:14px;letter-spacing:.25px;padding:6px 0\"><span style=\"color:var(--mbe-color-on-surface-variant)\">Oldest unsent<\u002Fspan><span style=\"font-family:var(--mbe-font-mono)\">08:31<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:12px 14px;border-radius:12px;background:var(--mbe-color-primary-container);color:var(--mbe-color-on-primary-container);font-size:12px;letter-spacing:.4px\">Images are kept until the server confirms them, then deleted from the phone — signatures are personal data and never sit around.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:12px 16px 18px;background:var(--mbe-color-surface-container-high);border-top:1px solid var(--mbe-color-outline-variant)\">\n    <button style=\"width:100%;height:56px;border-radius:9999px;border:1px solid var(--mbe-color-outline);background:transparent;color:var(--mbe-color-on-surface);font-family:var(--mbe-font-brand);font-weight:600;font-size:16px\">Send diagnostics to dispatch<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: \"show what dispatch sees when <a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa> is still uploading\" · \"add a stuck-queue warning after 2 hours\" · \"merge <a class=\"dv-oid\" href=\"#2c\">2c<\u002Fa> into the sync screen <a class=\"dv-oid\" href=\"#1g\">1g<\u002Fa>\"<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t1\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\">1<\u002Fa><span class=\"dv-tname\">Driver mobile — offline-first delivery feedback sync<\u002Fspan><\u002Fdiv>\n\n<div class=\"brief\">\n<h3>What I assumed, and why it looks like this<\u002Fh3>\n<ul>\n<li><b>Offline-first is the spine, not a feature.<\u002Fb> Every driver action writes to a local queue first; a persistent sync strip on every screen states connection + how many changes are waiting. Nothing in the flow blocks on the network except the photo upload, which is deferred.<\u002Fli>\n<li><b>Sun, gloves, one hand.<\u002Fb> Primary actions are 64px full-width bars pinned to the bottom third; status uses fills and dark ink rather than thin color, so it survives glare. No status is communicated by hue alone — every chip carries a word.<\u002Fli>\n<li><b>Feedback is structured first, notes second.<\u002Fb> Delivered quantity + shortfall reason code are required fields; free text and photos sit underneath as optional colour. That keeps the <code>delivered + returned + committed + open = quantity<\u002Fcode> invariant enforceable on device.<\u002Fli>\n<li><b>Concurrency is a first-class state.<\u002Fb> A line lost to another driver's row lock appears as an inline released-line banner (1c) and a blocking sheet only when it invalidates work already entered (1j).<\u002Fli>\n<li><b>Placeholders:<\u002Fb> the map is a stand-in for real tiles — delivery-order lat/lng availability is still an open question in the research.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"1a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>Today's route — list. Live: tap List/Map, tap a stop.<\u002Fdiv>\n<div class=\"ph\" data-screen-label=\"Route list\">\n  <div style=\"display:flex;justify-content:space-between;padding:10px 18px 2px;font-family:var(--mbe-font-mono);font-size:12px;color:var(--mbe-color-on-surface-variant)\"><span>09:41<\u002Fspan><span>◺ ▮▮▯ 38%<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:8px 16px 14px;background:var(--mbe-color-surface)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px\">\n      <div>\n        <div style=\"font-family:var(--mbe-font-brand);font-weight:700;font-size:24px;line-height:1.33\">Route 8<\u002Fdiv>\n        <div style=\"font-size:14px;color:var(--mbe-color-on-surface-variant);letter-spacing:.25px\">Sun 23 Aug · Van MBE-114<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:44px;height:44px;border-radius:9999px;background:var(--mbe-color-primary-container);color:var(--mbe-color-on-primary-container);display:grid;place-items:center;font-family:var(--mbe-font-brand);font-weight:600;font-size:14px\">JR<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"{{ syncStripStyle }}\" sc-camel-on-click=\"{{ sync }}\">\n    <span style=\"width:10px;height:10px;border-radius:9999px;background:currentColor;flex:none\"><\u002Fspan>\n    <span style=\"flex:1;font-size:14px;font-weight:600;font-family:var(--mbe-font-brand)\">{{ lor-surface-container-low);border-radius:16px;padding:16px\"><div style=\"font-family:var(--mbe-font-brand);font-weight:700;font-size:24px;color:var(--mbe-color-error)\">1<\u002Fdiv><div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant)\">Failed<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--mbe-color-surface-container-low);border-radius:16px;padding:16px\"><div style=\"font-family:var(--mbe-font-brand);font-weight:700;font-size:24px\">1<\u002Fdiv><div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant)\">Still pending<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:12px 14px;border-radius:12px;background:var(--mbe-color-primary-container);color:var(--mbe-color-on-primary-container);margin-bottom:16px\">\n      <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:14px\">Stop 8 is still pending<\u002Fdiv>\n      <div style=\"font-size:12px;letter-spacing:.4px;margin-top:2px\">The route can't close until every stop has an outcome. Mark it failed if you never got there.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:16px;margin-bottom:10px\">Coming back on the truck<\u002Fdiv>\n    <sc-for list=\"{{ returns }}\" as=\"r\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--mbe-color-outline-variant)\">\n        <div>\n          <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:16px\">{{ r.name }}<\u002Fdiv>\n          <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant)\">{{ r.reason }} · stop {{ r.stop }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--mbe-font-brand);font-weight:700;font-size:18px;white-space:nowrap\">{{ r.qty }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant);padding:14px 0 20px\">Warehouse re-counts these against the manifest; commitments release only once the route closes.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:12px 16px 18px;background:var(--mbe-color-surface-container-high);border-top:1px solid var(--mbe-color-outline-variant)\">\n    <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant);margin-bottom:8px\">{{ queueCount }} changes still queued — they send before the route closes<\u002Fdiv>\n    <button style=\"width:100%;height:64px;border:0;border-radius:9999px;background:var(--mbe-color-inverse-surface);color:var(--mbe-color-on-inverse-surface);font-family:var(--mbe-font-brand);font-weight:600;font-size:18px\">Back at warehouse<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1j\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1j\">1j<\u002Fa>Conflict sheet — the blocking case, when work already entered is invalidated.<\u002Fdiv>\n<div class=\"ph\" data-screen-label=\"Conflict sheet\">\n  <div style=\"flex:1;position:relative;background:var(--mbe-color-surface);overflow:hidden\">\n    <div style=\"padding:14px 16px;background:var(--mbe-color-surface-container);opacity:.5\">\n      <div style=\"font-family:var(--mbe-font-brand);font-weight:600;font-size:22px\">Stop 7 of 16<\u002Fdiv>\n      <div style=\"font-family:var(--mbe-font-mono);font-size:12px\">DO-24817<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:16px;opacity:.35\">\n      <div style=\"height:88px;border-radius:12px;background:var(--mbe-color-surface-container-low);margin-bottom:10px\"><\u002Fdiv>\n      <div style=\"height:120px;border-radius:12px;background:var(--mbe-color-surface-container-low);margin-bottom:10px\"><\u002Fdiv>\n      <div style=\"height:120px;border-radius:12px;background:var(--mbe-color-surface-container-low)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;background:rgba(0,0,0,.45)\"><\u002Fdiv>\n    <div style=\"position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:var(--mbe-color-surface-container-highest);padding:22px 20px 24px;box-shadow:0 -5px 10px rgba(0,0,0,.35)\">\n      <div style=\"width:44px;height:44px;border-radius:9999px;background:var(--mbe-color-error-container);color:var(--mbe-color-on-error-container);display:grid;place-items:center;font-size:20px;margin-bottom:14px\">⚠<\u002Fdiv>\n      <div style=\"font-family:var(--mbe-font-brand);font-weight:700;font-size:24px;line-height:1.33;margin-bottom:8px\">Someone else delivered this line<\u002Fdiv>\n      <div style=\"font-size:16px;letter-spacing:.5px;line-height:1.5;color:var(--mbe-color-on-surface-variant);margin-bottom:6px\">C. Rivas closed <b>CLA-25 · Clavo 2½\"<\u002Fb> on route 11 at 09:36, before your change reached the server.<\u002Fdiv>\n      <div style=\"border-radius:12px;background:var(--mbe-color-surface-container-lowest);padding:12px 14px;margin:14px 0 18px\">\n        <div style=\"font-size:12px;letter-spacing:.4px;color:var(--mbe-color-on-surface-variant)\">Your queued change<\u002Fdiv>\n        <div style=\"font-size:16px\">Adjust commitment → 12 kg<\u002Fdiv>\n        <div style=\"font-family:var(--mbe-font-mono);font-size:12px;color:var(--mbe-color-on-surface-variant);margin-top:4px\">queued 10:02 · rejected 409<\u002Fdiv>\n      <\u002Fdiv>\n      <button style=\"width:100%;height:64px;border:0;border-radius:9999px;background:var(--mbe-color-primary);color:var(--mbe-color-on-primary);font-family:var(--mbe-font-brand);font-weight:600;font-size:18px;margin-bottom:10px\">Refresh this stop<\u002Fbutton>\n      <button style=\"width:100%;height:56px;border-radius:9999px;border:1px solid var(--mbe-color-outline);background:transparent;color:var(--mbe-color-on-surface);font-family:var(--mbe-font-brand);font-weight:600;font-size:16px\">Keep my note for dispatch<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: \"take the wizard from <a class=\"dv-oid\" href=\"#1e\">1e<\u002Fa> but with <a class=\"dv-oid\" href=\"#1f\">1f<\u002Fa>'s verdict buttons\" · \"add an arrival screen before <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa>\" · \"show the dispatcher's side of the same sync\"<\u002Fp>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst REASONS = [\n  {k:'CUSTOMER_REFUSED', label:'Refused'},\n  {k:'NOBODY_PRESENT', label:'Nobody there'},\n  {k:'WRONG_ADDRESS', label:'Wrong address'},\n  {k:'DAMAGED_GOODS', label:'Damaged'},\n  {k:'OTHER', label:'Other'}\n];\nconst CHIP = 'padding:6px 12px;border-radius:8px;font-family:var(--mbe-font-brand);font-weight:600;font-size:14px;letter-spacing:.1px;white-space:nowrap';\nconst PILL = 'height:48px;padding:0 18px;border-radius:9999px;font-family:var(--mbe-font-brand);font-weight:600;font-size:14px;letter-spacing:.1px';\nconst SMALL = 'height:44px;padding:0 14px;border-radius:9999px;font-family:var(--mbe-font-brand);font-weight:600;font-size:13px';\n\nfunction statusChip(st) {\n  if (st === 'delivered') return {chip:'Delivered', bg:'var(--mbe-color-inverse-surface)', fg:'var(--mbe-color-on-inverse-surface)'};\n  if (st === 'partial') return {chip:'Partial', bg:'var(--mbe-color-tertiary)', fg:'var(--mbe-color-on-tertiary)'};\n  if (st === 'failed') return {chip:'Failed', bg:'var(--mbe-color-error)', fg:'var(--mbe-color-on-error)'};\n  if (st === 'next') return {chip:'Next stop', bg:'var(--mbe-color-primary)', fg:'var(--mbe-color-on-primary)'};\n  return {chip:'Pending', bg:'var(--mbe-color-surface-container-highest)', fg:'var(--mbe-color-on-surface-variant)'};\n}\n\nclass Component extends DCLogic {\n  state = {\n    view: 'list',\n    online: false,\n    syncing: false,\n    queue: [\n      {id:'q1', title:'Stop 5 closed', detail:'Signature + 4 line outcomes', t:'09:12', status:'Sent'},\n      {id:'q2', title:'Stop 6 closed', detail:'3 outcomes · photo 1.2 MB pending', t:'09:48', status:'Queued'},\n      {id:'q3', title:'Commitment adjusted', detail:'Stop 7 · CEM-42 → 24 sacks', t:'10:02', status:'Queued'},\n      {id:'q4', title:'Stop 4 marked failed', detail:'Nobody present · photo of gate', t:'08:31', status:'Conflict', action:'Resolve conflict'}\n    ],\n    qty: {l1:24, l2:6, l4:2},\n    committed: {l1:true, l2:true, l4:false},\n    idType: 'DNI',\n    podMode: 'signature',\n    closeQty: {c1:24, c2:4},\n    closeReason: {c2:'DAMAGED_GOODS'},\n    step: 1,\n    verdicts: {v1:'all', v2:'some', v3:null},\n    verdictReason: {v2:'CUSTOMER_REFUSED'},\n    bucket: 'today',\n    pct: 0,\n    uploading: false,\n    wifiOnly: true,\n    keepQueue: true\n  };\n\n  startUpload = () => {\n    if (this.state.uploading || this.state.pct >= 100) return;\n    this.setState({uploading: true});\n    this.timer = setInterval(() => this.setState(s => {\n      const next = Math.min(100, s.pct + 9);\n      if (next >= 100) { clearInterval(this.timer); return {pct: 100, uploading: false}; }\n      return {pct: next};\n    }), 240);\n  };\n\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  set(patch) { this.setState(patch); }\n  mapSet(key, k, v) { this.setState(s => ({[key]: Object.assign({}, s[key], {[k]: v})})); }\n\n  sync = () => {\n    if (!this.state.online || this.state.syncing) return;\n    this.setState({syncing: true});\n    setTimeout(() => this.setState(s => ({\n      syncing: false,\n      queue: s.queue.map(q => q.status === 'Queued' ? Object.assign({}, q, {status:'Sent', t:'10:11'}) : q)\n    })), 1100);\n  };\n\n  renderVals() {\n    const s = this.state;\n    const pending = s.queue.filter(q => q.status !== 'Sent').length;\n    const conflicts = s.queue.filter(q => q.status === 'Conflict').length;\n\n    const stripBase = 'display:flex;align-items:center;gap:10px;padding:12px 16px;';\n    const strip = s.online\n      ? stripBase + 'background:var(--mbe-color-secondary-container);color:var(--mbe-color-on-secondary-container)'\n      : stripBase + 'background:var(--mbe-color-primary-container);color:var(--mbe-color-on-primary-container)';\n\n    const stopData = [\n      {n:1, name:'Ferretería Ávila', addr:'Av. Juárez 1204', items:'6 lines · 48 cs', st:'delivered'},\n      {n:2, name:'Tlapalería El Roble', addr:'Calle Morelos 88', items:'2 lines · 12 cs', st:'partial', note:'2 cs damaged, returning'},\n      {n:3, name:'Constructora Nieto', addr:'Blvd. Norte 4500', items:'9 lines · 120 cs', st:'delivered'},\n      {n:4, name:'Depósito San Ángel', addr:'Priv. Olivos 12', items:'1 line · 4 cs', st:'failed', note:'Nobody present · retry tomorrow'},\n      {n:5, name:'Ferretera Zapata', addr:'Calz. Industrial 900', items:'4 lines · 30 cs', st:'delivered'},\n      {n:6, name:'Materiales Herrera', addr:'Camino Real 77', items:'3 lines · 18 cs', st:'delivered', note:'Queued — not yet sent'},\n      {n:7, name:'Abarrotes La Central', addr:'Mercado 2, Local L-14', items:'4 lines · 48 cs', st:'next'},\n      {n:8, name:'Hotel Puerta Vieja', addr:'Reforma 210', items:'2 lines · 9 cs', st:'pending'}\n    ];\n    const stops = stopData.map(d => {\n      const c = statusChip(d.st);\n      const active = d.st === 'next';\n      return Object.assign({}, d, {\n        chip: c.chip,\n        chipStyle: CHIP + ';background:' + c.bg + ';color:' + c.fg,\n        cardStyle: 'display:flex;gap:12px;padding:14px;margin-bottom:10px;border-radius:16px;background:' +\n          (active ? 'var(--mbe-color-surface-container-high)' : 'var(--mbe-color-surface-container-low)') +\n          ';border:' + (active ? '2px solid var(--mbe-color-primary)' : '1px solid var(--mbe-color-outline-variant)'),\n        seqStyle: 'width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--mbe-font-brand);font-weight:700;font-size:18px;background:' + c.bg + ';color:' + c.fg\n      });\n    });\n\n    const lineData = [\n      {id:'l1', code:'CEM-42', name:'Cemento gris 50 kg', open:24, sent:'24', unit:'sacks'},\n      {id:'l2', code:'PIN-VB', name:'Pintura vinílica 19 L', open:6, sent:'6', unit:'pails'},\n      {id:'l3', code:'CLA-25', name:'Clavo 2½\"', open:12, sent:'—', unit:'kg', locked:true},\n      {id:'l4', code:'SIL-TR', name:'Silicón transparente', open:2, sent:'2', unit:'boxes'}\n    ];\n    const lines = lineData.map(l => {\n      if (l.locked) {\n        return Object.assign({}, l, {\n          editable: false, qty: 0,\n          chip: 'Released', chipStyle: CHIP + ';background:var(--mbe-color-error-container);color:var(--mbe-color-on-error-container)',\n          rowStyle: 'padding:14px 16px;border-top:1px solid var(--mbe-color-outline-variant);opacity:.55'\n        });\n      }\n      const on = !!s.committed[l.id];\n      return Object.assign({}, l, {\n        editable: true,\n        qty: s.qty[l.id],\n        chip: on ? 'Committed' : 'Open',\n        chipStyle: CHIP + (on\n          ? ';background:var(--mbe-color-inverse-surface);color:var(--mbe-color-on-inverse-surface)'\n          : ';background:var(--mbe-color-surface-container-highest);color:var(--mbe-color-on-surface-variant)'),\n        rowStyle: 'padding:14px 16px;border-top:1px solid var(--mbe-color-outline-variant);background:' + (on ? 'var(--mbe-color-surface-container-low)' : 'transparent'),\n        btnLabel: on ? 'Release' : 'Commit',\n        btnStyle: 'height:56px;padding:0 20px;border-radius:9999px;font-family:var(--mbe-font-brand);font-weight:600;font-size:16px;border:0;' + (on\n          ? 'background:transparent;border:1px solid var(--mbe-color-outline);color:var(--mbe-color-on-surface)'\n          : 'background:var(--mbe-color-primary);color:var(--mbe-color-on-primary)'),\n        toggle: () => this.mapSet('committed', l.id, !on),\n        inc: () => this.mapSet('qty', l.id, Math.min(l.open, s.qty[l.id] + 1)),\n        dec: () => this.mapSet('qty', l.id, Math.max(0, s.qty[l.id] - 1))\n      });\n    });\n    c

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    html,body{margin:0;padding:0}
    body{background:#090807}
    a{color:#ecab03}
    a:hover{color:#ffd466}
    .ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;user-select:none}
  </style>
</helmet>

<div style="width:608px;min-height:300px;box-sizing:border-box;padding:24px;background:#090807;color:#efe9df;font-family:'Roboto',system-ui,-apple-system,sans-serif;display:flex;align-items:flex-start;justify-content:center">
  <div style="width:560px;background:#3b3429;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.55);display:flex;flex-direction:column">

    <div style="padding:24px 24px 0 24px">
      <div style="font:600 22px/1.27 'Archivo',system-ui,sans-serif;color:#efe9df">Delete price list?</div>
    </div>

    <div style="padding:16px 24px 0 24px;display:flex;flex-direction:column;gap:16px">
      <div style="font:400 14px/1.43 'Roboto',system-ui,sans-serif;letter-spacing:.25px;color:#b4aca0">
        <span style="color:#efe9df;font-weight:500">Seasonal 2024</span>
        <span style="font-family:'Roboto Mono',ui-monospace,monospace;color:#b4aca0">#12</span>
        will be permanently deleted. This cannot be undone.
      </div>
      <div style="display:flex;gap:8px;align-items:center;padding:12px;border-radius:12px;border:1px solid #4e473d">
        <span class="ms" style="font-size:20px;color:#b4aca0">check_circle</span>
        <span style="font:400 14px/1.43 'Roboto',system-ui,sans-serif;letter-spacing:.25px;color:#b4aca0">No prices and no customers depend on this list.</span>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:24px">
      <div style="display:flex;align-items:center;height:32px;padding:0 16px;box-sizing:border-box;border-radius:999px;color:#ecab03;font:600 14px/1 'Archivo',system-ui,sans-serif;letter-spacing:.1px">Cancel</div>
      <div style="display:flex;align-items:center;justify-content:center;height:32px;padding:0 16px;box-sizing:border-box;border-radius:999px;background:#d8262e;color:#ffffff;font:600 14px/1 'Archivo',system-ui,sans-serif;letter-spacing:.1px">Delete list</div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":608,"height":300}}'>
class Component extends DCLogic {}
</script>
</body>
</html>

# DigitalOcean App Platform spec for the `demo` deployment's web site
# (spec 045, research R6). The deploy repo's branch holds the prebuilt bundle;
# tool/release.sh web demo pushes it and runs `doctl apps ...`.
name: mbe-web-demo
static_sites:
  - name: web
    github:
      repo: mictlanix/mbe-ui-web-deploy
      branch: web/demo
      deploy_on_push: false
    output_dir: /
    index_document: index.html
    # Every in-app route falls back to the app shell, so reloads and deep links
    # work. (error_document would answer them with HTTP 404.)
    catchall_document: index.html
